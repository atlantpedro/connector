[package]
name = "lodav-core"
description = "Datenportal Connector: edit Beck Datenportal CMS documents in LibreOffice or Microsoft Office"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
log = "0.4"
percent-encoding = "2"
# rustls with the system trust store and the system proxy settings, as a corporate network needs
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sys-locale = "0.3"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
